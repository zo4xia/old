<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>field-char-escape-filter · 10 步过滤流水线示例</title>
<style>
  :root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--ink:#f1f5f9;--muted:#94a3b8;
        --brand:#22d3ee;--warn:#fbbf24;--ok:#4ade80;--err:#f87171;--line:#334155}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
  .panel h2{font-size:14px;margin:0 0 10px;color:var(--brand)}
  textarea{width:100%;height:120px;background:#0b1220;color:var(--ink);
            border:1px solid var(--line);border-radius:6px;padding:10px;
            font-family:"JetBrains Mono","Consolas",monospace;font-size:12px;resize:vertical}
  button{background:var(--brand);color:#0b1220;border:0;border-radius:6px;
         padding:8px 14px;font-weight:600;cursor:pointer;margin-top:8px}
  button:hover{filter:brightness(1.1)}
  .steps{margin-top:10px}
  .step{padding:8px 10px;border-left:3px solid var(--line);margin:6px 0;
        background:var(--surface-2);border-radius:0 6px 6px 0;font-size:12px;
        font-family:"JetBrains Mono","Consolas",monospace;white-space:pre-wrap;word-break:break-all}
  .step .n{display:inline-block;width:24px;height:24px;border-radius:50%;
           background:var(--brand);color:#0b1220;text-align:center;line-height:24px;
           font-weight:700;margin-right:8px;font-family:sans-serif}
  .step .label{color:var(--muted);font-size:11px;margin-bottom:4px}
  .step .out{color:var(--ok)}
  .step.skip{opacity:.4;border-left-color:var(--muted)}
  .step.warn{border-left-color:var(--warn)}
  .step.err{border-left-color:var(--err)}
  .step.skip .n{background:var(--muted)}
  .step.warn .n{background:var(--warn)}
  .step.err .n{background:var(--err)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .presets button{background:var(--surface-2);color:var(--ink);font-size:11px;padding:5px 10px}
  .presets button:hover{background:var(--brand);color:#0b1220}
  .badge{display:inline-block;background:var(--warn);color:#0b1220;
         padding:1px 6px;border-radius:4px;font-size:10px;margin-left:6px;font-weight:600}
  .note{color:var(--muted);font-size:11px;margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<h1>field-char-escape-filter · 10 步过滤流水线</h1>
<p class="sub">车同轨·书同文 superFilter 示例 · 输入脏字符串 → 10 步逐次清洗 → 规范化输出。每步显示是否触发与中间结果。</p>

<div class="presets" id="presets"></div>

<div class="grid">
  <div class="panel">
    <h2>输入（脏字符串）</h2>
    <textarea id="input" placeholder="粘贴含 LaTeX 损伤 / HTML 实体 / 缺字 / 除号 / 控制字符的字符串..."></textarea>
    <button onclick="run()">▶ 运行 10 步过滤</button>
    <p class="note">点上方预设可一键填入典型损伤案例。点"运行"看每步是否触发与中间结果。</p>
  </div>
  <div class="panel">
    <h2>10 步流水线</h2>
    <div class="steps" id="steps"></div>
  </div>
</div>

<div class="panel" style="margin-top:16px">
  <h2>最终规范化输出（落 canvas 的板书行）</h2>
  <div id="final" style="background:#0b1220;border:1px solid var(--line);border-radius:6px;
       padding:10px;font-family:monospace;font-size:13px;min-height:40px;color:var(--ok);
       white-space:pre-wrap;word-break:break-all"></div>
  <p class="note">注：DOM 字幕输出还会再过一道 <code>esc()</code> 把 &amp; &lt; &gt; 转义，canvas 板书不需要。</p>
</div>

<script>
// ─── superFilter 10 步（与 SKILL.md §二 完全对齐） ──────────────
const GLYPH2COMMON=[
  [/[\u00D7\u2715\u2716\u2717]/g,'x'],
  [/[\u00F7\u2215]/g,'/'],
  [/\u2212/g,'-'],
  [/\u2234/g,'因此'],
  [/\u2235/g,'因为']
];
const LATEX2U=[
  [/\\times(?=\d|\s|$|[^a-zA-Z])/g,'x'],[/\\div(?=\d|\s|$|[^a-zA-Z])/g,'/'],[/\\cdot\b/g,'·'],
  [/\^\s*(?:\{\s*\\circ\s*\}|\\circ)/g,'°'],[/\\circ\b/g,'°'],[/\\degree\b/g,'°'],
  [/\^\s*(?:\{\s*2\s*\}|2)/g,'²'],[/\^\s*(?:\{\s*3\s*\}|3)/g,'³'],
  [/\\angle\b/g,'∠'],[/\\pm\b/g,'±'],[/\\perp\b/g,'⊥'],[/\\parallel\b/g,'∥'],
  [/\\triangle\b/g,'三角形'],[/\\therefore\b/g,'因此'],[/\\because\b/g,'因为'],
  [/\\le(?:q)?\b/g,'≤'],[/\\ge(?:q)?\b/g,'≥'],[/\\ne(?:q)?\b/g,'≠'],[/\\approx\b/g,'≈'],
  [/\\pi\b/g,'π'],[/\\infty\b/g,'∞'],[/\\sqrt\s*\{([^}]*)\}/g,'√$1'],[/\\sqrt\b/g,'√'],
  [/\\rightarrow\b/g,'→'],[/\\Rightarrow\b/g,'⇒'],[/\\to\b/g,'→']
];
function decodeHtmlEntities(t){
  return t.replace(/&times;/g,'x').replace(/&divide;/g,'/').replace(/&minus;/g,'-')
    .replace(/&plusmn;/g,'±').replace(/&deg;/g,'°').replace(/&le;/g,'≤')
    .replace(/&ge;/g,'≥').replace(/&ne;/g,'≠').replace(/&middot;/g,'·')
    .replace(/&mdash;/g,'—').replace(/&hellip;/g,'…').replace(/&sup2;/g,'²')
    .replace(/&sup3;/g,'³').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<')
    .replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/&amp;/g,'&');
}
function repairCommonLatexEscapeDamage(t){
  return t.replace(/\u000c\s*rac/g,'\\frac')
    .replace(/(^|[^\w\\])rac(?=\s*\{)/g,'$1\\frac')
    .replace(/(^|[^\w\\])frac(?=\s*\{)/g,'$1\\frac');
}

// 每步包装成可记录是否触发的函数
const STEPS=[
  {n:1,label:'字面 \\n 还原（后非字母）',
    fn:t=>t.replace(/\\r\\n/g,'\n').replace(/\\n(?![a-zA-Z])/g,'\n')},
  {n:2,label:'控制字符 \\t \\b \\v \\f 退化',
    fn:t=>t.replace(/[\t\u0008\u000B\u000C]+/g,' ')},
  {n:3,label:'HTML 实体解码（&amp; 最后）',
    fn:t=>decodeHtmlEntities(t)},
  {n:4,label:'LaTeX 损伤修复（\\f→\\u000c, rac/frac→\\frac）',
    fn:t=>repairCommonLatexEscapeDamage(t)},
  {n:5,label:'删 $ \\left \\right（绝不字面落板）',
    fn:t=>t.replace(/\$+/g,'').replace(/\\left\b|\\right\b/g,'')},
  {n:6,label:'手写体缺字降级（× ÷ ∴ ∵ −）',
    fn:t=>{let r=t;for(const [re,s] of GLYPH2COMMON)r=r.replace(re,s);return r;}},
  {n:7,label:'LaTeX → Unicode（\\times \\sqrt \\pi ...）',
    fn:t=>{let r=t;for(const [re,s] of LATEX2U)r=r.replace(re,s);return r;}},
  {n:8,label:'角标 x^2 → x², x^3 → x³',
    fn:t=>t.replace(/(\w|\))\^2\b/g,'$1²').replace(/(\w|\))\^3\b/g,'$1³')},
  {n:9,label:'除号 a/b → \\frac{a}{b}（禁用 ÷ 与平铺斜杠）',
    fn:t=>t.replace(/(^|[^\w./\\{])([A-Za-z]|\d+)\s*\/\s*([A-Za-z]|\d+)(?=$|[^\w./])/g,'$1\\frac{$2}{$3}')},
  {n:10,label:'压行内空白（绝不碰 \\n）',
    fn:t=>t.replace(/[\t ]+/g,' ').trim()}
];

// ─── 可视化转义：把控制字符 / 反斜杠显示出来 ──────────────
function vis(s){
  return String(s)
    .replace(/\u000c/g,'\\f〈0x0C〉')
    .replace(/\u000b/g,'\\v')
    .replace(/\u0008/g,'\\b')
    .replace(/\t/g,'⇥')
    .replace(/\n/g,'↵\n');
}

function run(){
  const input=document.getElementById('input').value;
  const stepsEl=document.getElementById('steps');
  const finalEl=document.getElementById('final');
  stepsEl.innerHTML='';
  let t=input;
  STEPS.forEach((step)=>{
    const before=t;
    const after=step.fn(t);
    const changed=before!==after;
    const div=document.createElement('div');
    div.className='step'+(changed?'':' skip');
    div.innerHTML=
      '<span class="n">'+step.n+'</span>'+
      '<span class="label">'+step.label+(changed?'':' · 未触发')+'</span>'+
      (changed?'\n  前: '+vis(before)+'\n  后: <span class="out">'+vis(after)+'</span>':'');
    stepsEl.appendChild(div);
    t=after;
  });
  finalEl.textContent=t||'(空)';
}

// ─── 预设案例 ──────────────
const PRESETS=[
  {name:'LaTeX \\\\f 损伤', s:'面积 = \\frac{1}{2} × 底 × 高'},
  {name:'rac 损伤（丢反斜杠）', s:'rac{3}{4} x 20.4 = 15.3'},
  {name:'HTML 实体残留', s:'5 &times; 3 &amp; 2&nbsp;cm'},
  {name:'&amp; 二次解码坑', s:'&amp;lt;script&amp;gt;'},
  {name:'控制字符 \\f \\t', s:'第一行\\f\\t第二行\t第三行'},
  {name:'手写体缺字 ×÷∴∵', s:'面积 = 底 × 高 ÷ 2，∴ S = ah'},
  {name:'LaTeX 命令残留', s:'\\sqrt{16} = 4, \\pi ≈ 3.14, \\angle A = 90\\circ'},
  {name:'除号平铺斜杠', s:'3/4 + 5/6 = 19/12'},
  {name:'平方立方角标', s:'边长^2 = 9, 体积 = a^3'},
  {name:'$ 字面落板', s:'$\\frac{1}{2}$ 是一半'},
  {name:'\\left \\right 残留', s:'\\left( a + b \\right)^2'},
  {name:'综合：板书一行', s:'方法一：面积公式\\nS = 9 × 20.4\\n  = 183.6 (cm²)\\n分数：\\frac{3}{4} x 20.4 = 15.3'}
];
const presetsEl=document.getElementById('presets');
PRESETS.forEach(p=>{
  const b=document.createElement('button');
  b.textContent=p.name;
  b.onclick=()=>{document.getElementById('input').value=p.s;run();};
  presetsEl.appendChild(b);
});

// 默认填一个综合案例
document.getElementById('input').value=PRESETS[PRESETS.length-1].s;
run();
</script>
</body>
</html>
